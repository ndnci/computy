name: Computy checks and packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: computy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
jobs:
  native-and-desktop:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: macos-15
            platform: macos-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.100.0
      - run: npm ci
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - run: cargo fmt --manifest-path desktop/Cargo.toml --check
      - run: cargo test --locked --manifest-path native/Cargo.toml
      - run: cargo clippy --locked --manifest-path native/Cargo.toml --all-targets -- -D warnings
      - run: npm run build:engine
      - run: npm test
      - run: npm run format:check
      # Linux packages are built in the same Debian toolchain as local releases
      # (scripts/gpui-docker.sh), which keeps the binary's glibc requirement low.
      - if: runner.os == 'Linux'
        run: |
          docker build --target gpui -t computy-gpui:local .
          docker run --rm -v "$PWD:/workspace" -w /workspace -e CARGO_TARGET_DIR=/workspace/desktop/target \
            computy-gpui:local bash -c "cargo test --locked --manifest-path desktop/Cargo.toml && cargo clippy --locked --manifest-path desktop/Cargo.toml --all-targets -- -D warnings && scripts/package-deb.sh && chown -R $(id -u):$(id -g) desktop/target native/target release"
      - if: runner.os != 'Linux'
        run: |
          cargo test --locked --manifest-path desktop/Cargo.toml
          cargo build --locked --release --manifest-path desktop/Cargo.toml
      - run: node scripts/collect-release.mjs
        env:
          COMPUTY_RELEASE_PLATFORM: ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          name: computy-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1
