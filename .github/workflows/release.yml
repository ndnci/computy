name: Release downloads
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-release.mjs
        env:
          COMPUTY_RELEASE_TAG: ${{ github.event.release.tag_name }}
  build:
    needs: validate
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: computy-*
          path: release-assets
          merge-multiple: true
      - name: Attach verified packages to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/*
