[package]
name = "computy"
version = "0.1.0"
description = "Votre matériel, en clair."
authors = ["NDNCI"]
edition = "2024"
rust-version = "1.95"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
computy-engine = { path = "../native", default-features = false }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde_json = "1"
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
