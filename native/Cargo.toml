[package]
name = "computy-engine"
version = "0.1.6"
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.95"

[features]
default = ["cli"]
boot-helper = []
cli = ["dep:clap", "dep:tokio", "dep:axum", "dep:getrandom", "dep:subtle", "dep:ctrlc", "dep:auto-launch"]

[[bin]]
name = "computy-cli"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "computy-boot-helper"
path = "src/bin/computy-boot-helper.rs"
required-features = ["boot-helper"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk", "component"] }
sha2 = "0.10"
libc = "0.2"
fs2 = "0.4"
clap = { version = "4.6", features = ["derive"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"], optional = true }
axum = { version = "0.8", optional = true }
getrandom = { version = "0.3", optional = true }
subtle = { version = "2", optional = true }
ctrlc = { version = "3", optional = true }
auto-launch = { version = "0.5", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory", "Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
