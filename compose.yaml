services:
  verify:
    build:
      context: .
      target: verify
    command: ["sh", "-c", "cargo test --locked --manifest-path native/Cargo.toml && cargo test --locked --manifest-path desktop/Cargo.toml && npm test"]
  desktop-build:
    build:
      context: .
      target: desktop-build
    command: ["sh", "-c", "cp release/*.deb /artifacts/"]
    volumes:
      - ./release:/artifacts
