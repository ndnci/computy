[package]
name = "computy-desktop"
version = "0.4.0"
license = "GPL-3.0-only"
description = "Votre matériel, en clair."
authors = ["NDNCI"]
edition = "2024"
rust-version = "1.100"

[[bin]]
name = "computy"
path = "src/main.rs"

[dependencies]
computy-engine = { path = "../native", default-features = false }
gpui = "=0.2.2"
gpui-component = "=0.5.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"
fs2 = "0.4"
auto-launch = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "webp", "bmp"] }
resvg = "0.45"
smallvec = "1"
png = "0.18"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
log = "0.4"
futures = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.9"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.21"
file_icon_provider = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

# GPUI 0.2.2 transitively uses xattr 0.2.3, whose Linux errno alias was removed
# by current libc. vendor/xattr keeps the upstream API and fixes that alias.
[patch.crates-io]
xattr = { path = "../vendor/xattr" }
# Closing the last window must not quit while the tray is running (see vendor/gpui).
gpui = { path = "../vendor/gpui" }
